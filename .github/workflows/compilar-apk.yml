name: Construir APK de Horizonte

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar el codigo de GitHub
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar herramientas de la app
        run: |
          npm install
          npm install @capacitor/core @capacitor/android

      - name: Crear archivo web base obligatorio
        run: |
          mkdir -p www
          echo "<html><body>Horizonte App</body></html>" > www/index.html

      - name: Crear carpetas de Android reales
        run: |
          npx cap init Horizonte com.tuempresa.horizonte --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Compilar APK con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK como resultado de la compilacion
        uses: actions/upload-artifact@v4
        with:
          name: APK-Horizonte-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
