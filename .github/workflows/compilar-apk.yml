name: Construir APK de Horizonte

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo de GitHub
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar herramientas de la app
        run: |
          npm install
          npm install @capacitor/core @capacitor/android

      - name: Crear carpetas de Android reales
        run: |
          npx cap init Horizonte com.tuempresa.horizonte --web-dir=.
          npx cap add android
          npx cap sync android

      - name: Guardar carpetas para revision
        uses: actions/upload-artifact@v4
        with:
          name: Estructura-Android-Horizonte
          path: .
